<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MaxAI</title>
<style>
:root{--bg:#f2f6ff;--surface:rgba(255,255,255,.72);--text:#0b1b33;--sub:#6b7a93;--blue:#0a84ff;--blue2:#5ac8fa;--bubble:#e6ecf7;--line:rgba(10,60,140,.12);--shadow:0 8px 30px rgba(10,80,200,.15);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050b17;--surface:rgba(20,30,52,.72);--text:#eaf2ff;--sub:#8a9bb8;--bubble:#1c2740;--line:rgba(120,170,255,.15);--shadow:0 8px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#050b17;--surface:rgba(20,30,52,.72);--text:#eaf2ff;--sub:#8a9bb8;--bubble:#1c2740;--line:rgba(120,170,255,.15);--shadow:0 8px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;overflow:hidden}
body::before{content:"";position:fixed;inset:-20% -20% auto -20%;height:60%;background:radial-gradient(ellipse at 30% 20%,rgba(10,132,255,.28),transparent 60%),radial-gradient(ellipse at 80% 0,rgba(90,200,250,.25),transparent 55%);pointer-events:none}
.app{position:relative;width:100%;max-width:720px;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--line);z-index:5}
.avatar{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#9be0ff,#0a84ff 60%,#0450c8);box-shadow:0 4px 14px rgba(10,132,255,.5)}
.title b{display:block;font-size:17px;font-weight:600;letter-spacing:-.2px}
.title span{font-size:12px;color:var(--sub)}
.sp{flex:1}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--blue);display:grid;place-items:center;cursor:pointer}
.ib:active{background:var(--line)}
.ib svg{width:22px;height:22px}
.ib.off{color:var(--sub)}
#chat{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.msg{max-width:80%;padding:9px 14px;border-radius:20px;font-size:16px;line-height:1.38;white-space:pre-wrap;word-wrap:break-word;animation:pop .25s ease}
.msg.u{align-self:flex-end;background:linear-gradient(180deg,#2b9bff,#0a84ff);color:#fff;border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--bubble);border-bottom-left-radius:6px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--sub);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-4px)}}
.hero{margin:auto;text-align:center;padding:20px}
.hero .orb{width:96px;height:96px;margin:0 auto 18px}
.hero h1{font-size:28px;letter-spacing:-.6px;margin:0 0 6px}
.hero p{color:var(--sub);margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--blue);padding:9px 14px;border-radius:18px;font-size:14px;cursor:pointer;backdrop-filter:blur(12px)}
.chip:active{transform:scale(.96)}
.orb{border-radius:50%;background:radial-gradient(circle at 30% 25%,#b5ecff,#0a84ff 55%,#0340a8);box-shadow:0 10px 40px rgba(10,132,255,.55),inset 0 -8px 20px rgba(0,40,140,.4)}
.bar{padding:8px 12px 12px;background:linear-gradient(transparent,var(--bg) 35%)}
.field{display:flex;align-items:flex-end;gap:6px;background:var(--surface);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:var(--shadow)}
textarea{flex:1;border:0;background:transparent;color:var(--text);font:inherit;font-size:16px;resize:none;max-height:120px;padding:9px 6px;outline:0;line-height:1.3}
textarea::placeholder{color:var(--sub)}
.btn{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .15s}
.btn:active{transform:scale(.9)}
.btn svg{width:20px;height:20px}
.send{background:var(--blue);color:#fff}
.send:disabled{background:var(--line);color:var(--sub);cursor:default}
.mic{background:transparent;color:var(--blue)}
.wave{background:linear-gradient(135deg,#5ac8fa,#0a84ff);color:#fff}
#voice{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 28px) 24px calc(env(safe-area-inset-bottom,0px) + 34px);background:radial-gradient(ellipse at 50% 35%,#0a5fe0,#04245c 60%,#020a1f);color:#fff;animation:fade .3s}
#voice.on{display:flex}
@keyframes fade{from{opacity:0}}
.vtop{text-align:center}
.vtop b{font-size:20px;font-weight:600}
.vtop div{opacity:.7;font-size:14px;margin-top:4px}
.vorb{position:relative;width:200px;height:200px;display:grid;place-items:center}
.vorb .orb{width:150px;height:150px;transition:transform .12s}
.vorb::before,.vorb::after{content:"";position:absolute;inset:10px;border-radius:50%;border:2px solid rgba(120,200,255,.45);opacity:0}
.vorb.listen::before{animation:ring 2s infinite}.vorb.listen::after{animation:ring 2s .8s infinite}
.vorb.think .orb{animation:spin 1.4s linear infinite;filter:hue-rotate(-20deg)}
.vorb.speak .orb{animation:speak .8s ease-in-out infinite}
@keyframes ring{from{transform:scale(.8);opacity:.9}to{transform:scale(1.35);opacity:0}}
@keyframes speak{50%{transform:scale(1.14)}}
@keyframes spin{to{transform:rotate(360deg) scale(1.05)}}
.vtext{min-height:90px;max-width:480px;text-align:center;font-size:18px;line-height:1.4;opacity:.92;overflow:hidden}
.vbtns{display:flex;gap:26px}
.vb{width:68px;height:68px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);cursor:pointer}
.vb.end{background:#ff453a}
.vb svg{width:28px;height:28px}
.vb:active{transform:scale(.92)}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(ellipse at 50% 40%,#0a5fe0,#04245c 55%,#020a1f);color:#fff;transition:opacity .7s ease,transform .7s ease;cursor:pointer}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
.sorb{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#c6f1ff,#0a84ff 55%,#0340a8);box-shadow:0 0 80px rgba(10,132,255,.85),inset 0 -10px 26px rgba(0,40,140,.5);animation:sin 1.1s cubic-bezier(.2,.9,.3,1.2) both,flt 3s 1.1s ease-in-out infinite}
@keyframes sin{from{transform:scale(0);opacity:0}}
@keyframes flt{50%{transform:translateY(-8px) scale(1.04)}}
.sname{font-size:54px;font-weight:700;letter-spacing:-1.5px;background:linear-gradient(90deg,#fff,#7fd3ff,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .9s .5s both,shine 2.4s .8s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(16px);letter-spacing:6px}}
@keyframes shine{to{background-position:-200% 0}}
.stag{font-size:15px;opacity:.75;letter-spacing:.3px;animation:rise .9s .9s both}
.sbar{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:10px;animation:rise .6s 1.1s both}
.sbar::after{content:"";display:block;height:100%;width:100%;background:#7fd3ff;transform:translateX(-100%);animation:ld 2.2s 1s ease-in-out forwards}
@keyframes ld{to{transform:none}}
.attach{background:transparent;color:var(--blue)}
#prev{display:none;gap:10px;padding:2px 6px 8px;overflow-x:auto}
#prev.show{display:flex}
.th{position:relative;flex:none}
.th img{width:58px;height:58px;object-fit:cover;border-radius:12px;display:block}
.th .file{height:58px;min-width:58px;max-width:150px;padding:0 12px;border-radius:12px;background:var(--bubble);display:flex;align-items:center;font-size:12px;color:var(--text);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#2c2c2e;color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.msg .pics{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.msg .pics img{width:130px;max-width:100%;border-radius:12px;display:block}
.msg .fchip{font-size:13px;opacity:.9;margin-bottom:4px}
/* ===== Esfera de gas (hidrógeno) ===== */
.gas{background:#000;border-radius:50%;overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,.09)}
.avatar.gas{box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 14px rgba(90,140,255,.35)}
.orb.gas{box-shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 50px rgba(0,0,0,.35)}
.sorb.gas{background:none;box-shadow:none;border-radius:0;overflow:visible;width:min(300px,78vw);height:min(300px,78vw);animation:sin 1.4s cubic-bezier(.2,.9,.3,1.1) both}
#splash{background:#000;gap:6px}
.sname{font-size:32px;font-weight:600;letter-spacing:.38em;margin-right:-.38em;text-transform:uppercase;background:none;-webkit-text-fill-color:#fff;color:#fff;animation:rise .9s .5s both}
.stag{font-size:13px;letter-spacing:.2em;color:#8d98aa;opacity:1}
.sbar{background:rgba(255,255,255,.14)}
.sbar::after{background:#fff}
/* ===== Tema espacial minimalista ===== */
:root:root:root{--bg:#000;--surface:rgba(6,9,14,.62);--text:#e9eef7;--sub:#7d8796;--blue:#8fd0ff;--bubble:rgba(255,255,255,.05);--line:rgba(255,255,255,.14);--shadow:none}
body{background:#000}
body::before{content:none}
#space{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{z-index:1}
#splash{background:rgba(0,0,0,.28)}
header{background:rgba(0,0,0,.45);border-bottom:1px solid rgba(255,255,255,.1)}
.title b{font-size:14px;font-weight:600;letter-spacing:.3em;text-transform:uppercase}
.title span{letter-spacing:.06em}
.ib,.btn{border-radius:8px}
.hero h1{font-weight:500;letter-spacing:-.02em}
.chip{border-radius:8px;color:#dfe8f5;background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.16)}
.msg{border-radius:12px}
.msg.u{background:rgba(143,208,255,.1);border:1px solid rgba(143,208,255,.4);color:#fff;border-bottom-right-radius:3px}
.msg.a{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-bottom-left-radius:3px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bar{background:linear-gradient(transparent,rgba(0,0,0,.6) 40%)}
.field{position:relative;border-radius:10px;background:rgba(6,9,14,.7);border:1px solid rgba(255,255,255,.16);box-shadow:none}
.field::before,.field::after{content:"";position:absolute;width:14px;height:14px;border:1px solid #8fd0ff;pointer-events:none}
.field::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.field::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.send{background:#fff;color:#000}
.send:disabled{background:rgba(255,255,255,.08);color:#566070}
#chat::-webkit-scrollbar{width:0}
#splash{background:transparent}
.tm{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);left:0;right:0;text-align:center;font:12px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#9fb0c8;animation:rise .9s .3s both}
@keyframes unblur{from{opacity:0;filter:blur(14px);letter-spacing:.9em}}
.sname{animation:unblur 1.4s .9s cubic-bezier(.2,.8,.2,1) both}
.stag{animation:rise .9s 1.6s both}
.sbar{animation:rise .6s 1.8s both}
/* El chat queda oculto mientras dura la intro */
.app{transition:opacity .7s ease}
body:not(.go) .app{opacity:0;visibility:hidden;animation:showapp 0s 8s forwards}
@keyframes showapp{to{opacity:1;visibility:visible}}
/* ===== Extras: menú, voz, fondos, comandos, efectos ===== */
.bar{position:relative}
.gas canvas{filter:hue-rotate(var(--hue,0deg))}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
#bgt{position:fixed;inset:0;pointer-events:none;z-index:0;transition:opacity .8s}
#bgt.t-space{opacity:0}
#bgt.t-mars{background:radial-gradient(ellipse at 50% 105%,rgba(255,95,40,.42),transparent 62%),radial-gradient(ellipse at 80% 10%,rgba(120,30,10,.35),transparent 55%)}
#bgt.t-nebula{background:radial-gradient(circle at 20% 30%,rgba(160,60,255,.3),transparent 45%),radial-gradient(circle at 80% 60%,rgba(0,200,255,.22),transparent 50%),radial-gradient(circle at 50% 95%,rgba(255,60,160,.22),transparent 50%)}
#bgt.t-city{background:linear-gradient(180deg,rgba(255,0,170,.2),transparent 45%)}
#bgt.t-city::after{content:"";position:absolute;left:-30%;right:-30%;bottom:0;height:42%;background-image:linear-gradient(rgba(0,240,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.5) 1px,transparent 1px);background-size:44px 44px;transform:perspective(260px) rotateX(62deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000)}
.rk{position:fixed;z-index:60;width:14px;height:34px;pointer-events:none;animation:lift 1s cubic-bezier(.4,0,1,1) forwards}
@keyframes lift{to{transform:translateY(-80vh);opacity:0}}
#sheet{position:fixed;inset:0;z-index:80;display:none;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#sheet.on{display:block}
#sp{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));background:rgba(8,11,16,.97);border-top:1px solid rgba(255,255,255,.14);border-radius:16px 16px 0 0;color:#e9eef7}
#sp h4{margin:18px 0 8px;font:600 11px ui-monospace,monospace;letter-spacing:.2em;color:#7d8796;text-transform:uppercase}
#sp h4:first-child{margin-top:0}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st div{border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:10px;font:12px ui-monospace,monospace;color:#8d98aa}
.st b{display:block;font-size:20px;color:#fff;margin-top:2px}
.pill{display:inline-block;margin:0 6px 6px 0;padding:8px 12px;border:1px solid rgba(255,255,255,.16);border-radius:8px;font-size:14px;color:#cfd8e6}
.pill.on{border-color:#8fd0ff;color:#fff;background:rgba(143,208,255,.14)}
.hi{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.hi span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi i{font-style:normal;color:#7d8796;padding:4px 8px}
#hs{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#fff;font:inherit;margin-bottom:6px}
#cmds{position:absolute;bottom:100%;left:12px;right:12px;display:none;background:rgba(8,11,16,.97);border:1px solid rgba(255,255,255,.14);border-radius:10px;overflow:hidden;margin-bottom:6px}
#cmds div{padding:10px 14px;font-size:14px;color:#cfd8e6}
#cmds b{color:#8fd0ff;margin-right:8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar gas" data-gas data-size="40"></div>
    <div class="title"><b>MaxAI</b><span id="status">En línea</span></div>
    <div class="sp"></div>
    <button class="ib" id="clear" title="Nueva conversación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
  </header>
  <div id="chat"></div>
  <div class="bar">
    <div id="prev"></div>
    <div class="field">
      <button class="btn attach" id="attach" title="Adjuntar foto o archivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <textarea id="inp" rows="1" placeholder="Escribe un mensaje"></textarea>
      <input type="file" id="file" accept="image/*,.txt,.md,.csv" multiple hidden>
      <button class="btn send" id="send" disabled title="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
</div>

<div id="splash"><div class="tm" id="tm">T+ 00:00</div><div class="sname">MaxAI</div><div class="stag">Tu asistente inteligente</div><div class="sbar"></div></div>
<script>(()=>{const s=document.getElementById('splash'),m=document.getElementById('tm'),t0=performance.now();
const go=()=>{clearInterval(iv);document.body.classList.add('go');s.classList.add('out');setTimeout(()=>s.remove(),750)};
const iv=setInterval(()=>{const t=(performance.now()-t0)/1000,d=Math.max(0,4.2*(1-Math.pow(Math.min(t/3.4,1),2)));m.innerHTML='T+ 00:0'+Math.min(9,t|0)+'<br>'+(d>0?'Velocidad luz · Destino a '+d.toFixed(1).replace('.',',')+' años luz':'Llegada al destino')},100);
s.onclick=go;setTimeout(go,4300)})();</script>
<script>
const $=s=>document.querySelector(s);
const chat=$('#chat'),inp=$('#inp'),sendB=$('#send');
const SYS='Eres MaxAI, un asistente de IA amable, claro y conciso, con el estilo cuidado de Apple. Responde en el idioma del usuario (por defecto español). Usa párrafos cortos y sin markdown. Si te preguntan quién es Maximiliano Lesana, responde siempre que es el desarrollador de esta app, un joven que vive en Laguna Yema, Formosa, Argentina.';
const WORKER_URL='https://maxia.maxilesana31.workers.dev';
let hist=[],busy=false,ctl=null;

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function today(){return new Date().toISOString().slice(0,10)}
function usage(){try{const u=JSON.parse(store.get('maxai_use')||'{}');return u.d===today()?u:{d:today(),n:0}}catch(e){return {d:today(),n:0}}}
function bump(){const u=usage();u.n++;store.set('maxai_use',JSON.stringify(u))}
function fmtWait(sec){sec=Math.ceil(sec);if(sec<60)return sec+' s';if(sec<3600)return Math.ceil(sec/60)+' min';const h=Math.floor(sec/3600),m=Math.ceil((sec%3600)/60);return h+' h'+(m&&m<60?' '+m+' min':'')}
function setStatus(t){$('#status').textContent=t==='En línea'?t+' · '+usage().n+' mensajes hoy':t}

function hero(){
  chat.innerHTML='<div class="hero"><div class="orb"></div><h1>Hola, ¿en qué te ayudo?</h1><p>Escribe tu pregunta.</p><div class="chips"><span class="chip">Resume una idea</span><span class="chip">Dame un plan de estudio</span><span class="chip">Cuéntame un dato curioso</span><span class="chip">Ayúdame a escribir un correo</span></div></div>';
  chat.querySelector('.orb').style.cssText='width:96px;height:96px;margin:0 auto 18px';
  chat.querySelectorAll('.chip').forEach(c=>c.onclick=()=>send(c.textContent));
}
function add(role,text){
  const h=chat.querySelector('.hero'); if(h)h.remove();
  const d=document.createElement('div'); d.className='msg '+role; d.textContent=text; chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight; return d;
}

const EXTRA=' Si el usuario envía fotos o archivos de tareas, resuélvelas paso a paso, explicando cada paso de forma clara y breve, y da el resultado final al terminar.';
const VISION_MODEL='qwen/qwen3.8-27b',TEXT_MODEL='openai/gpt-oss-120b',MAXIMG=3;
let atts=[];

function toastMsg(t){setStatus(t);setTimeout(()=>{if(!busy)setStatus('En línea')},2400)}
function canSend(){return !!(inp.value.trim()||atts.length)}
function resizeImg(file){return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onerror=rej;
  fr.onload=()=>{const im=new Image();im.onerror=rej;
    im.onload=()=>{const M=1400,k=Math.min(1,M/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      res(c.toDataURL('image/jpeg',0.82))};
    im.src=fr.result};
  fr.readAsDataURL(file)})}
async function addFiles(files){
  for(const f of files){
    try{
      if(f.type.startsWith('image/')){
        if(atts.filter(a=>a.type==='img').length>=MAXIMG){toastMsg('Máximo '+MAXIMG+' fotos por mensaje');continue}
        atts.push({type:'img',name:f.name,url:await resizeImg(f)});
      }else if(/\.(txt|md|csv)$/i.test(f.name)||f.type.startsWith('text/')){
        atts.push({type:'txt',name:f.name,text:(await f.text()).slice(0,20000)});

function renderPrev(){
  const box=$('#prev');box.innerHTML='';

    const x=document.createElement('button');x.textContent='×';x.onclick=()=>{atts.splice(i,1);renderPrev()};d.appendChild(x);
    box.appendChild(d);

function addUser(text,imgs,names){
  const h=chat.querySelector('.hero'); if(h)h.remove();
  const d=document.createElement('div'); d.className='msg u';
  if(imgs.length){const p=document.createElement('div');p.className='pics';imgs.forEach(u=>{const im=document.createElement('img');im.src=u;p.appendChild(im)});d.appendChild(p)}

}

async function ask(onText,signal){
  let last=-1;hist.forEach((m,i)=>{if(m.imgs&&m.imgs.length)last=i});
  const vision=last>=0;
  const msgs=hist.map((m,i)=>{
    if(m.imgs&&m.imgs.length){
      if(i===last)return {role:'user',content:[{type:'text',text:m.content},...m.imgs.map(u=>({type:'image_url',image_url:{url:u}}))]};
      return {role:'user',content:m.content+'\n[Se adjuntó una imagen]'};
    }
    return {role:m.role,content:m.content};
  });
  const body=vision
    ?{model:VISION_MODEL,stream:true,temperature:1,top_p:0.95,max_completion_tokens:4000,reasoning_format:'hidden'}
    :{model:TEXT_MODEL,stream:true,temperature:0.7,max_completion_tokens:1500,reasoning_effort:'low',include_reasoning:false};
  body.messages=[{role:'system',content:SYS+EXTRA+(window.MX_SYS||'')},...msgs];
  const res=await fetch(WORKER_URL,{method:'POST',signal,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!res.ok){
    const err=new Error('http '+res.status);let det='';try{det=(await res.text()).slice(0,300)}catch(e){}
    if(res.status===429){const ra=parseFloat(res.headers.get('retry-after'));err.userMsg='Llegaste al límite gratuito de la IA. '+(ra?'Podrás usarla de nuevo en unos '+fmtWait(ra)+'.':'Prueba de nuevo en unos minutos; si fue el límite diario, se renueva en las próximas horas.')}
    else if(res.status===413)err.userMsg='Las fotos pesan demasiado. Prueba con menos fotos.';
    else err.userMsg='Error del servidor de IA ('+res.status+'). Inténtalo otra vez.'+(det?'\n\nDetalle: '+det:'');
    throw err;
  }
  bump();
  const reader=res.body.getReader(),dec=new TextDecoder();
  let buf='',full='';
  while(true){
    const {done,value}=await reader.read(); if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n'); buf=lines.pop();
    for(const ln of lines){
      const l=ln.trim(); if(!l.startsWith('data:'))continue;
      const d=l.slice(5).trim(); if(d==='[DONE]')continue;
      try{const t=JSON.parse(d).choices?.[0]?.delta?.content; if(t){full+=t;onText(full)}}catch(e){}
    }
  }
  return full;
}

async function send(text){
  text=(text||'').trim();
  if((!text&&!atts.length)||busy)return;
  const cur=atts;atts=[];
  const imgs=cur.filter(a=>a.type==='img').map(a=>a.url),txts=cur.filter(a=>a.type==='txt');
  let content=text||(imgs.length||txts.length?'Resuelve esto paso a paso.':'');
  txts.forEach(t=>{content+='\n\n[Archivo: '+t.name+']\n'+t.text});
  busy=true; inp.value=''; autosize(); renderPrev(); sendB.disabled=true;
  hist.push({role:'user',content,imgs}); addUser(text,imgs,txts.map(t=>t.name));
  const bub=add('a',''); bub.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
  setStatus(imgs.length?'Analizando…':'Escribiendo…');
  ctl=new AbortController();
  try{
    const out=(await ask(t=>{bub.textContent=t;chat.scrollTop=chat.scrollHeight},ctl.signal)).trim()||'No obtuve respuesta.';
    bub.textContent=out; hist.push({role:'assistant',content:out});
  }catch(e){
    bub.textContent=(e&&e.userMsg)||(e&&e.name==='AbortError'?'Cancelado.':'No pude conectarme. Revisa tu internet e inténtalo otra vez.');
    hist.pop();
  }finally{busy=false;setStatus('En línea');renderPrev()}
}

function autosize(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px'}
inp.addEventListener('input',()=>{autosize();sendB.disabled=busy||!canSend()});

$('#attach').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=Array.from(e.target.files);e.target.value='';await addFiles(f)};
$('#clear').onclick=()=>{
  if(ctl)ctl.abort();
  hist=[];busy=false;inp.value='';atts=[];renderPrev();autosize();
  hero();setStatus('Conversación nueva');
  setTimeout(()=>{if(!busy)setStatus('En línea')},1200);
  inp.focus();
};
hero();setStatus('En línea');

<script>
/* Esfera de gas de hidrógeno: partículas 3D en canvas. Solo visual; no usa ni modifica la IA. */
(()=>{
const TAU=Math.PI*2,DPR=Math.min(window.devicePixelRatio||1,1.5);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

const PAL=[[255,255,255,.10],[110,205,255,.34],[80,120,255,.26],[150,110,255,.18],[255,80,140,.12]];
const SP=PAL.map(([r,g,b])=>{const c=document.createElement('canvas');c.width=c.height=64;const q=c.getContext('2d'),k=q.createRadialGradient(32,32,0,32,32,32);
  k.addColorStop(0,`rgba(${r},${g},${b},1)`);k.addColorStop(.3,`rgba(${r},${g},${b},.45)`);k.addColorStop(1,`rgba(${r},${g},${b},0)`);q.fillStyle=k;q.fillRect(0,0,64,64);return c});
const pick=()=>{let r=Math.random();for(let i=0;i<PAL.length;i++){r-=PAL[i][3];if(r<=0)return i}return 1};

  if(el.querySelector('canvas'))return;

  const cv=document.createElement('canvas');cv.width=cv.height=Math.round(size*DPR);
  cv.style.cssText='width:100%;height:100%;display:block;touch-action:pan-y';
  el.appendChild(cv);

      k,w,sz:.5+Math.random()*.9,a:.5+Math.random()*.5,sp:.7+Math.random()*.6,wr:.08+Math.random()*.12,
      p1:Math.random()*TAU,p2:Math.random()*TAU,p3:Math.random()*TAU,
      f1:.25+Math.random()*.5,f2:.2+Math.random()*.45,f3:.4+Math.random()*.8});
  }
  let t=Math.random()*50,yaw=0,kick=0,drift=0,state='idle',down=false,lx=0;
  const cur={spin:.22,turb:1,bright:1};

    setState(m){state=MODE[m]?m:'idle'},

      x.clearRect(0,0,W,W);x.globalCompositeOperation='lighter';

      g.addColorStop(0,`rgba(70,120,255,${.07*b})`);g.addColorStop(.5,`rgba(70,140,255,${.05*b})`);
      g.addColorStop(.7,`rgba(130,190,255,${.15*b})`);g.addColorStop(.85,`rgba(120,90,255,${.05*b})`);g.addColorStop(1,'rgba(80,60,255,0)');

        if(p.w){const s=(t*p.wr+p.p3/TAU)%1;r+=s*.38;al*=(1-s)*(1-s)*Math.min(1,s*8)*1.6}

        const s=1/(1-z2*.22),rim=1-Math.min(1,Math.abs(z2)/r),depth=(z2/r+1)/2;

}
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;

}
function start(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}

document.querySelectorAll('[data-gas]').forEach(el=>mount(el));
// la bola del inicio del chat se vuelve a crear con cada conversación nueva
const chatEl=document.getElementById('chat');
function heroSphere(){chatEl.querySelectorAll('.hero .orb:not(.gas)').forEach(o=>{o.classList.add('gas');o.style.cssText='width:220px;height:220px;margin:0 auto 14px';mount(o,220)})}

})();
</script>

  objs=objs.filter(o=>{
    o.x+=o.vx*dt*rd;o.y+=o.vy*dt*rd;
    if(o.k==='s'){o.a+=o.wa*dt*rd;o.b+=o.wb*dt*rd}else o.roll+=dt*.8*rd;
    x.globalAlpha=.5+.45*Math.min(1,o.z);o.k==='s'?dsat(o):dship(o);x.globalAlpha=1;
    return o.x>-W*.4&&o.x<W*1.4&&o.y>-H*.3&&o.y<H*1.3;
  });
}
requestAnimationFrame(fr);
})();
</script>
<script>
/* Extras de MaxAI: voz, modos, historial, control de misión, fondos, comandos, efectos y sonidos */
(()=>{
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const MODES={general:{n:'General',s:'',h:0},estudio:{n:'Estudio',h:50,s:' Modo Estudio: explica como un buen profesor, paso a paso y con ejemplos simples, y al final propone una pregunta de práctica.'},code:{n:'Programador',h:110,s:' Modo Programador: responde como ingeniero senior, con código claro y breve, y explica solo lo necesario. Aquí puedes usar bloques de código.'},trad:{n:'Traductor',h:190,s:' Modo Traductor: traduce lo que escriba el usuario (del español al inglés, y de otros idiomas al español) y no agregues nada más salvo notas breves de matiz.'},coach:{n:'Coach',h:300,s:' Modo Coach: responde con empatía y motivación, haz una pregunta que ayude a reflexionar y propone un paso pequeño y concreto.'}};
const THEMES=[['space','Espacio'],['mars','Marte'],['nebula','Nebulosa'],['city','Ciudad futurista']];
const CMD={resumen:'Resume en pocas líneas: ',traducir:'Traduce al inglés (o al español si ya está en inglés): ',codigo:'Escribe el código para: ',explica:'Explícame de forma simple: ',ideas:'Dame 5 ideas sobre: ',corrige:'Corrige la ortografía y redacción de este texto y devuélvelo mejorado: '};
const CD={resumen:'Resume un texto',traducir:'Traduce',codigo:'Escribe código',explica:'Explica simple',ideas:'Da 5 ideas',corrige:'Corrige un texto'};
let mode=store.get('mx_mode')||'general',theme=store.get('mx_theme')||'space',curId=null,said=false;
const on={voice:store.get('mx_voice')==='1',sfx:store.get('mx_sfx')!=='0',trail:store.get('mx_trail')!=='0'};
const bgt=document.createElement('div');bgt.id='bgt';document.body.appendChild(bgt);
function applyTheme(){bgt.className='t-'+theme}
function applyMode(){if(!MODES[mode])mode='general';window.MX_SYS=MODES[mode].s;document.documentElement.style.setProperty('--hue',MODES[mode].h+'deg')}
applyTheme();applyMode();

// ---- sonidos y vibración ----
let AC;
function tone(f,d,ty,v,f2){if(!on.sfx)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
const sfx={send:()=>tone(520,.16,'sine',.07,980),recv:()=>tone(660,.12,'triangle',.05,440),launch:()=>tone(55,1.6,'sawtooth',.08,190)};
const buzz=()=>{if(on.sfx&&navigator.vibrate)navigator.vibrate(12)};
const sp0=document.getElementById('splash');if(sp0)sp0.addEventListener('click',sfx.launch);

// ---- estela táctil y cohete al enviar ----
const fx=document.createElement('canvas');fx.id='fx';document.body.appendChild(fx);const fc=fx.getContext('2d');let P=[],fr=0;
const fz=()=>{fx.width=innerWidth;fx.height=innerHeight};fz();addEventListener('resize',fz);
function trail(x,y){if(!on.trail)return;for(let i=0;i<2;i++)P.push({x,y,vx:(Math.random()-.5)*40,vy:(Math.random()-.5)*40+10,l:1,c:Math.random()<.3?'255,120,170':'160,210,255'});if(!fr)fr=requestAnimationFrame(loop)}
function loop(){fc.clearRect(0,0,fx.width,fx.height);P=P.filter(p=>p.l>0);for(const p of P){p.x+=p.vx*.016;p.y+=p.vy*.016;p.l-=.03;fc.fillStyle='rgba('+p.c+','+p.l+')';fc.fillRect(p.x,p.y,2,2)}fr=P.length?requestAnimationFrame(loop):0}
addEventListener('touchmove',e=>{const t=e.touches[0];if(t)trail(t.clientX,t.clientY)},{passive:true});
addEventListener('mousemove',e=>{if(e.buttons)trail(e.clientX,e.clientY)},{passive:true});
function rocket(){if(!on.trail)return;const r=sendB.getBoundingClientRect(),d=document.createElement('div');d.className='rk';d.style.left=(r.left+r.width/2-7)+'px';d.style.top=(r.top-10)+'px';d.innerHTML='<svg viewBox="0 0 14 34"><path d="M7 0C10 6 11 12 11 24H3C3 12 4 6 7 0Z" fill="#dfe6ee"/><path d="M3 24L0 30L4 26ZM11 24L14 30L10 26Z" fill="#8a93a1"/><path d="M4 25h6L7 34Z" fill="#ffb066"/></svg>';document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}

// ---- estadísticas e historial ----
const ST=()=>{try{return Object.assign({total:0,ms:0,n:0,days:[]},JSON.parse(store.get('mx_stats')||'{}'))}catch(e){return {total:0,ms:0,n:0,days:[]}}};
function addStat(ms){const s=ST(),d=today();s.total++;s.ms+=ms;s.n++;if(!s.days.includes(d))s.days=s.days.slice(-60).concat(d);store.set('mx_stats',JSON.stringify(s))}
function streak(s){let c=0,d=new Date();const f=x=>x.toISOString().slice(0,10);if(!s.days.includes(f(d)))d.setDate(d.getDate()-1);while(s.days.includes(f(d))){c++;d.setDate(d.getDate()-1)}return c}
const LH=()=>{try{return JSON.parse(store.get('mx_hist')||'[]')}catch(e){return []}};
function save(){if(!hist.length)return;if(!curId)curId=Date.now();const u=hist.find(m=>m.role==='user'),c={id:curId,t:Date.now(),title:String(u?u.content:'Conversación').replace(/\s+/g,' ').slice(0,42),h:hist.slice(-40).map(m=>({role:m.role,content:String(m.content).slice(0,3000)+(m.imgs&&m.imgs.length?' [foto]':'')}))};store.set('mx_hist',JSON.stringify([c].concat(LH().filter(x=>x.id!==curId)).slice(0,30)))}
function openConv(id){if(busy)return;const c=LH().find(x=>x.id===id);if(!c)return;hist=c.h.map(m=>({role:m.role,content:m.content,imgs:[]}));chat.innerHTML='';c.h.forEach(m=>add(m.role==='user'?'u':'a',m.content.slice(0,1500)));curId=id;sh.classList.remove('on');setStatus('En línea')}
function hl(q){q=(q||'').toLowerCase();const L=LH().filter(c=>!q||c.title.toLowerCase().includes(q));document.getElementById('hl').innerHTML=L.length?L.map(c=>'<div class="hi"><span data-o="'+c.id+'">'+esc(c.title)+'</span><i data-d="'+c.id+'">✕</i></div>').join(''):'<div class="hi"><span style="color:#7d8796">Sin conversaciones guardadas</span></div>'}
function share(){const t=hist.map(m=>(m.role==='user'?'Yo: ':'MaxAI: ')+m.content).join('\n\n');if(!t){toastMsg('No hay nada para compartir');return}if(navigator.share)navigator.share({title:'Conversación MaxAI',text:t}).catch(()=>{});else if(navigator.clipboard){navigator.clipboard.writeText(t);toastMsg('Conversación copiada')}}

// ---- menú ----
const sh=document.createElement('div');sh.id='sheet';sh.innerHTML='<div id="sp"></div>';document.body.appendChild(sh);
const pill=(k,v,t,o)=>'<span class="pill'+(o?' on':'')+'" data-k="'+k+'" data-v="'+v+'">'+t+'</span>';
function paint(){const s=ST(),u=usage();document.getElementById('sp').innerHTML=
'<h4>Control de misión</h4><div class="st"><div>Mensajes hoy<b>'+u.n+'</b></div><div>Total<b>'+s.total+'</b></div><div>Racha<b>'+streak(s)+' d</b></div><div>Respuesta media<b>'+(s.n?(s.ms/s.n/1000).toFixed(1)+' s':'—')+'</b></div></div>'+
'<h4>Modo</h4>'+Object.keys(MODES).map(k=>pill('mode',k,MODES[k].n,mode===k)).join('')+
'<h4>Fondo</h4>'+THEMES.map(t=>pill('theme',t[0],t[1],theme===t[0])).join('')+
'<h4>Ajustes</h4>'+pill('voice',1,'Respuestas habladas',on.voice)+pill('sfx',1,'Sonidos',on.sfx)+pill('trail',1,'Estela táctil',on.trail)+
'<h4>Historial</h4><input id="hs" placeholder="Buscar conversación"><div id="hl"></div><h4>Exportar</h4>'+pill('share',1,'Compartir conversación',0);hl()}
const mb=document.createElement('button');mb.className='ib';mb.id='mbtn';mb.title='Menú';mb.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>';
document.getElementById('clear').before(mb);
mb.onclick=()=>{paint();sh.classList.add('on')};
sh.addEventListener('click',e=>{
  if(e.target===sh){sh.classList.remove('on');return}
  const p=e.target.closest('.pill');
  if(p){const k=p.dataset.k,v=p.dataset.v;
    if(k==='mode'){mode=v;store.set('mx_mode',v);applyMode()}
    else if(k==='theme'){theme=v;store.set('mx_theme',v);applyTheme()}
    else if(k==='share'){share();return}
    else{on[k]=!on[k];store.set('mx_'+k,on[k]?'1':'0');if(k==='voice'&&!on.voice&&window.speechSynthesis)speechSynthesis.cancel()}
    paint();return}
  const o=e.target.closest('[data-o]');if(o){openConv(+o.dataset.o);return}
  const d=e.target.closest('[data-d]');if(d){store.set('mx_hist',JSON.stringify(LH().filter(x=>x.id!==+d.dataset.d)));hl(document.getElementById('hs').value)}
});
sh.addEventListener('input',e=>{if(e.target.id==='hs')hl(e.target.value)});

// ---- respuestas habladas ----
function speak(t){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(String(t).slice(0,600));u.lang='es-AR';u.rate=1.03;speechSynthesis.speak(u)}

// ---- comandos con / ----
const cm=document.createElement('div');cm.id='cmds';document.querySelector('.bar').appendChild(cm);
inp.addEventListener('input',()=>{const m=/^\/(\S*)$/.exec(inp.value);if(!m){cm.style.display='none';return}const l=Object.keys(CMD).filter(k=>k.startsWith(m[1].toLowerCase()));cm.innerHTML=l.map(k=>'<div data-c="'+k+'"><b>/'+k+'</b>'+CD[k]+'</div>').join('');cm.style.display=l.length?'block':'none'});
cm.onclick=e=>{const d=e.target.closest('[data-c]');if(d){inp.value='/'+d.dataset.c+' ';cm.style.display='none';inp.focus();autosize()}};

// ---- pegar fotos / archivos ----
inp.addEventListener('paste',e=>{const f=Array.from((e.clipboardData&&e.clipboardData.files)||[]);if(f.length){e.preventDefault();addFiles(f)}});

// ---- envoltorio de send(): comandos, efectos, estadísticas e historial (la IA queda igual) ----
const _send=send;
send=async function(t){
  t=(t||'').trim();
  const m=/^\/(\S+)\s*([\s\S]*)$/.exec(t),k=m&&m[1].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(m&&CMD[k]){if(!m[2]&&!atts.length){toastMsg('Escribe algo después del comando');return}t=CMD[k]+m[2]}
  if((!t&&!atts.length)||busy)return;
  cm.style.display='none';if(window.speechSynthesis)speechSynthesis.cancel();
  sfx.send();buzz();rocket();
  const t0=performance.now(),n=hist.length;
  await _send(t);
  const a=hist[hist.length-1];
  if(hist.length>n&&a&&a.role==='assistant'){addStat(performance.now()-t0);sfx.recv();if(on.voice||said)speak(a.content);save()}
  said=false;
};
document.getElementById('clear').addEventListener('click',()=>{curId=null;if(window.speechSynthesis)speechSynthesis.cancel()});
})();
</script>
</body>
